<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FinType Pro v4.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-blue-100 p-8 space-y-6">
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 text-white rounded-2xl shadow-lg mb-4">
                <i class="fa-solid fa-wallet text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black text-blue-900 tracking-tight">FinType Pro v4.6</h1>
            <p class="text-xs text-blue-600 font-medium mt-1">Pencatatan Keuangan Zero-Friction</p>
        </div>

        {% if success %}
        <div class="p-3 bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs rounded-xl font-medium flex items-center gap-2">
            <i class="fa-solid fa-circle-check"></i>
            <span>{{ success }}</span>
        </div>
        {% endif %}

        {% if error %}
        <div class="p-3 bg-rose-50 border border-rose-200 text-rose-600 text-xs rounded-xl font-medium flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Username</label>
                <input type="text" name="username" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Password</label>
                <input type="password" name="password" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition-all">
            </div>
            <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-sm shadow-lg shadow-blue-500/20 transition-all active:scale-98">
                Masuk ke Aplikasi
            </button>
        </form>

        <div class="text-center text-xs text-slate-500">
            Belum punya akun? <a href="/register" class="text-blue-600 font-bold hover:underline">Daftar di sini</a>
        </div>
    </div>
</body>
</html>
